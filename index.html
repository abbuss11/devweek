<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> DevWeek </title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@17.0.19/build/css/intlTelInput.css">
    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@17.0.19/build/js/intlTelInput.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        .dropzone {
            border: 2px dashed #b8b8b9;
            transition: all 0.3s ease;
        }


        .dropzone:hover {
            border-color: #6B7280;
            background-color: #F9FAFB;
        }

        .dropzone.dragover {
            border-color: #3B82F6;
            background-color: #EFF6FF;
        }

        #flyer-container {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        #flyer-canvas {
            touch-action: none;
            /* Empêche le zoom tactile sur mobile */
        }
    </style>
</head>

<body class="bg-gradient-to-br from-indigo-50 to-purple-50 min-h-screen py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-4xl mx-auto">
        <div class="text-center mb-12">
            <h1 class="text-2xl font-bold text-gray-900 sm:text-3xl sm:tracking-tight lg:text-4xl">
                DevWeek 2025
            </h1>
            <p class="mt-5 max-w-xl mx-auto text-xl text-gray-500">
                Generer votre flyer de participation au DevWeek
            </p>
        </div>

        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Canvas Container -->
            <div class="flex-1">
                <div id="flyer-container"
                    class="bg-white rounded-xl overflow-hidden shadow-xl relative w-full aspect-square">
                    <canvas id="flyer-canvas" class="absolute top-0 left-0 w-full h-full"></canvas>
                    <div id="canvas-overlay" class="absolute inset-0 pointer-events-none"></div>
                </div>
                <div id="download-btn-container" class="mt-6 hidden">
                    <button id="download-btn"
                        class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transform hover:scale-105 transition-all duration-300">
                        Téléchargez
                    </button>
                </div>
            </div>

            <!-- Form Container -->
            <div class="flex-1">
                <div class="bg-white rounded-xl shadow-xl p-6">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6">Mise en page</h2>

                    <div class="space-y-6">
                        <!-- Upload Section -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Votre photo</label>
                            <div id="dropzone" class="dropzone rounded-lg p-8 text-center cursor-pointer">
                                <div class="space-y-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto h-12 w-12 text-gray-400"
                                        fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                                    </svg>
                                    <p class="text-sm text-gray-600">
                                        <span class="font-medium text-indigo-600">Cliquez pour upload</span> ou
                                        glissez-déposez
                                    </p>
                                    <p class="text-xs text-gray-500">PNG, JPG jusqu'à 5MB</p>
                                </div>
                                <input id="file-upload" type="file" accept="image/*" class="hidden">
                            </div>
                        </div>

                        <!-- Position Controls -->
                        <div id="position-controls" class="hidden space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Position</label>
                                <div class="grid grid-cols-3 gap-2">
                                    <button id="move-left" class="bg-gray-100 hover:bg-gray-200 p-2 rounded">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mx-auto" fill="none"
                                            viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M15 19l-7-7 7-7" />
                                        </svg>
                                    </button>
                                    <button id="move-up" class="bg-gray-100 hover:bg-gray-200 p-2 rounded">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mx-auto" fill="none"
                                            viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M5 15l7-7 7 7" />
                                        </svg>
                                    </button>
                                    <button id="move-right" class="bg-gray-100 hover:bg-gray-200 p-2 rounded">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mx-auto"
                                            fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M9 5l7 7-7 7" />
                                        </svg>
                                    </button>
                                    <button id="move-down"
                                        class="bg-gray-100 hover:bg-gray-200 p-2 rounded col-start-2">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mx-auto"
                                            fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M19 9l-7 7-7-7" />
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            <div>
                                <label for="zoom"
                                    class="block text-sm font-medium text-gray-700 mb-2">Zoom</label>
                                <input type="range" id="zoom" min="10" max="300" value="100"
                                    class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                            </div>

                            <div>
                                <label for="rotation"
                                    class="block text-sm font-medium text-gray-700 mb-2">Rotation</label>
                                <input type="range" id="rotation" min="0" max="360" value="0"
                                    class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                            </div>

                            <div>
                                <label for="opacity"
                                    class="block text-sm font-medium text-gray-700 mb-2">Opacité</label>
                                <input type="range" id="opacity" min="20" max="100" value="100"
                                    class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <p>&copy; TCC-Niger By Abbuss - DevO</p>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const EXPORT_SIZE = 1080; // Taille d'export fixe
            const container = document.getElementById('flyer-container');
            const canvasEl = document.getElementById('flyer-canvas');
            let canvasWidth = container.offsetWidth;

            // Initialiser le canvas avec la taille d'affichage
            const canvas = new fabric.Canvas('flyer-canvas', {
                selection: false,
                backgroundColor: '#fff',
                width: canvasWidth,
                height: canvasWidth,
                preserveObjectStacking: true
            });

            // Variables
            let baseImage = null; // L'flyer (premier plan)
            let backgroundImage = null; // L'image uploadée (arrière-plan)
            const dropzone = document.getElementById('dropzone');
            const fileInput = document.getElementById('file-upload');
            const positionControls = document.getElementById('position-controls');
            const downloadBtnContainer = document.getElementById('download-btn-container');

            // Load base image (flyer)
            const baseImageUrl = '/dark.png';
            fabric.Image.fromURL(baseImageUrl, function(img) {
                const scale = canvasWidth / img.width;
                img.set({
                    scaleX: scale,
                    scaleY: scale,
                    left: 0,
                    top: 0,
                    selectable: false,
                    evented: false,
                    lockMovementX: true,
                    lockMovementY: true,
                    hasControls: false,
                    hasBorders: false
                });
                canvas.add(img);
                baseImage = img;
                canvas.renderAll();
            });

            // Make canvas responsive
            function resizeCanvas() {
                canvasWidth = container.offsetWidth;
                canvas.setWidth(canvasWidth);
                canvas.setHeight(canvasWidth);

                // Resize images if they exist
                if (baseImage) {
                    const scale = canvasWidth / (baseImage.width * baseImage.scaleX);
                    baseImage.scale(scale);
                    baseImage.setCoords();
                }

                if (backgroundImage) {
                    const scale = (canvasWidth / (backgroundImage.width * backgroundImage.scaleX)) * (
                        backgroundImage.scaleX);
                    backgroundImage.scale(scale);
                    backgroundImage.setCoords();
                }

                canvas.renderAll();
            }

            window.addEventListener('resize', resizeCanvas);

            // Event Listeners
            dropzone.addEventListener('click', () => fileInput.click());

            dropzone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropzone.classList.add('dragover');
            });

            dropzone.addEventListener('dragleave', () => {
                dropzone.classList.remove('dragover');
            });

            dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropzone.classList.remove('dragover');

                if (e.dataTransfer.files.length) {
                    fileInput.files = e.dataTransfer.files;
                    handleImageUpload(e.dataTransfer.files[0]);
                }
            });

            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length) {
                    handleImageUpload(e.target.files[0]);
                }
            });

            // Movement controls
            document.getElementById('move-left').addEventListener('click', () => moveImage(-20, 0));
            document.getElementById('move-right').addEventListener('click', () => moveImage(20, 0));
            document.getElementById('move-up').addEventListener('click', () => moveImage(0, -20));
            document.getElementById('move-down').addEventListener('click', () => moveImage(0, 20));

            document.getElementById('zoom').addEventListener('input', (e) => {
                if (backgroundImage) {
                    const scale = e.target.value / 100;
                    backgroundImage.scale(scale);
                    canvas.renderAll();
                }
            });

            document.getElementById('rotation').addEventListener('input', (e) => {
                if (backgroundImage) {
                    backgroundImage.set('angle', parseInt(e.target.value));
                    canvas.renderAll();
                }
            });

            document.getElementById('opacity').addEventListener('input', (e) => {
                if (backgroundImage) {
                    backgroundImage.set('opacity', parseInt(e.target.value) / 100);
                    canvas.renderAll();
                }
            });

            // Download button
            document.getElementById('download-btn').addEventListener('click', downloadCanvas);

            // Functions
            function handleImageUpload(file) {
                if (!file.type.match('image.*')) {
                    alert('Veuillez sélectionner une image valide');
                    return;
                }

                const reader = new FileReader();

                reader.onload = function(e) {
                    fabric.Image.fromURL(e.target.result, function(img) {
                        // Remove previous background if exists
                        if (backgroundImage) {
                            canvas.remove(backgroundImage);
                        }

                        // Calculate scale to fit width
                        const initialScale = canvasWidth / img.width;

                        img.set({
                            left: canvasWidth / 2,
                            top: canvasWidth / 2,
                            originX: 'center',
                            originY: 'center',
                            scaleX: initialScale,
                            scaleY: initialScale,
                            selectable: false,
                            evented: true, // Permet de déplacer l'image
                            hasControls: false,
                            hasBorders: false,
                            lockRotation: false,
                            lockScalingX: false,
                            lockScalingY: false,
                            lockMovementX: false,
                            lockMovementY: false,
                            opacity: 1
                        });

                        canvas.add(img);
                        backgroundImage = img;

                        // S'assurer que l'flyer reste au premier plan
                        if (baseImage) {
                            canvas.bringToFront(baseImage);
                        }

                        // Activer le déplacement par glisser-déposer
                        img.on('mousedown', function() {
                            canvas.setActiveObject(img);
                        });

                        img.on('moved', function() {
                            canvas.renderAll();
                        });

                        // Show controls and download button
                        positionControls.classList.remove('hidden');
                        downloadBtnContainer.classList.remove('hidden');

                        // Update sliders
                        document.getElementById('zoom').value = 100;
                        document.getElementById('rotation').value = 0;
                        document.getElementById('opacity').value = 100;

                        canvas.renderAll();
                    });
                };

                reader.readAsDataURL(file);

                // Update dropzone appearance
                dropzone.innerHTML = `
                    <div class="flex items-center justify-center space-x-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-green-500" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                        </svg>
                        <span class="text-sm font-medium text-gray-700">${file.name}</span>
                    </div>
                `;
            }

            function moveImage(deltaX, deltaY) {
                if (backgroundImage) {
                    backgroundImage.set({
                        left: backgroundImage.left + deltaX,
                        top: backgroundImage.top + deltaY
                    });
                    canvas.renderAll();
                }
            }

            function downloadCanvas() {
                // Sauvegarder l'état actuel du canvas
                const currentWidth = canvas.getWidth();
                const currentHeight = canvas.getHeight();
                const objects = canvas.getObjects();

                // Redimensionner temporairement le canvas à 1080x1080
                canvas.setWidth(EXPORT_SIZE);
                canvas.setHeight(EXPORT_SIZE);

                // Mettre à l'échelle tous les objets pour la haute résolution
                const scale = EXPORT_SIZE / currentWidth;
                objects.forEach(obj => {
                    const originalScaleX = obj.scaleX;
                    const originalScaleY = obj.scaleY;
                    const originalLeft = obj.left;
                    const originalTop = obj.top;

                    obj.scaleX = originalScaleX * scale;
                    obj.scaleY = originalScaleY * scale;
                    obj.left = originalLeft * scale;
                    obj.top = originalTop * scale;
                    obj.setCoords();
                });

                // Rendre le canvas
                canvas.renderAll();

                // Créer le lien de téléchargement
                const link = document.createElement('a');
                link.download = 'devweek.jpg';
                link.href = canvas.toDataURL({
                    format: 'jpeg',
                    quality: 1.0,
                    multiplier: 1
                });

                // Restaurer la taille et l'échelle originales
                canvas.setWidth(currentWidth);
                canvas.setHeight(currentHeight);

                objects.forEach(obj => {
                    const originalScaleX = obj.scaleX / scale;
                    const originalScaleY = obj.scaleY / scale;
                    const originalLeft = obj.left / scale;
                    const originalTop = obj.top / scale;

                    obj.scaleX = originalScaleX;
                    obj.scaleY = originalScaleY;
                    obj.left = originalLeft;
                    obj.top = originalTop;
                    obj.setCoords();
                });

                canvas.renderAll();

                // Déclencher le téléchargement
                link.click();
            }
        });
    </script>
</body>

</html>
